services:
  api-tests:
    build: .
    environment:
      API_BASE_URI: ${API_BASE_URI:-http://host.docker.internal}
      API_BASE_PATH: ${API_BASE_PATH:-/api}
      API_PORT: ${API_PORT:-8080}
    volumes:
      - ./target/surefire-reports:/app/target/surefire-reports
      - ./target/allure-results:/app/target/allure-results
